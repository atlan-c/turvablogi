baseURL = "https://atlan-c.github.io/turvablogi/"
locale = "fi-FI"
title = "Turvablogi"
defaultContentLanguage = "fi"
enableRobotsTXT = true
summaryLength = 36

[taxonomies]
  tag = "tags"
  series = "series"

[params]
  description = "Kevyt, staattinen ja käytännönläheinen blogi uusista tekoälymalleista, agenttityöskentelystä, integraatioista ja lähdepohjaisesta arvioinnista."
  author = "Atlan"
  about = "Käytännönläheinen blogi uusista tekoälymalleista, agenteista, integraatioista ja siitä, mitä kannattaa oikeasti testata, epäillä tai ottaa käyttöön."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false
    lineNos = false
    style = "github"
    tabWidth = 2

[related]
  threshold = 20
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "series"
    weight = 120
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "topic_family"
    weight = 40
